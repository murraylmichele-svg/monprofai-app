<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonProf.ai</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>MonProf.ai</h1>
    <nav>
      <button onclick="showModule('roster')">Classe</button>
      <button onclick="showModule('observations')">Observations et conversations</button>
      <button onclick="showModule('productions')">Productions</button>
      <button onclick="showModule('bulletins')">Bulletins</button>
    </nav>
  </header>

  <main id="app">
    <div id="module-roster"></div>
    <div id="module-observations" style="display:none"></div>
    <div id="module-productions" style="display:none"></div>
    <div id="module-bulletins" style="display:none"></div>
  </main>
  <footer id="app-version-footer">MonProf.ai — v47</footer>

  <script src="xlsx.full.min.js"></script>
  <script src="roster.js"></script>
  <script src="audio-queue.js"></script>
  <script src="observations.js"></script>
  <script src="heic2any.min.js"></script>
  <script src="productions.js"></script>
  <script src="bulletins.js"></script>
  <script src="app.js"></script>

  <script>
    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      // Guard against an infinite reload loop — this must only fire once
      // per page load, even if controllerchange somehow fires more than once.
      var refreshingForNewVersion = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (refreshingForNewVersion) return;
        refreshingForNewVersion = true;
        window.location.reload();
      });

      var swRegistration = null;

      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/monprofai-app/sw.js')
          .then(function(reg) {
            console.log('Service worker registered:', reg.scope);
            swRegistration = reg;
            // Force a check for a newer sw.js on every page load, instead of
            // waiting for the browser's own (often slow, especially on iOS
            // Safari) internal update-checking schedule.
            reg.update();
          })
          .catch(function(err) {
            console.log('Service worker registration failed:', err);
          });
      });

      // iOS Safari often restores a backgrounded tab from its back-forward
      // cache (bfcache) or a suspended state instead of firing a fresh
      // 'load' event, so the check above never re-runs when switching back
      // to the app. These two listeners catch that case from different
      // angles, since iOS doesn't reliably fire the same event every time:
      // - 'pageshow' fires specifically on bfcache restores (event.persisted
      //   is true in that case), which is the most likely culprit on iOS.
      // - 'visibilitychange' catches the general "tab became visible again"
      //   case as a second safety net.
      function checkForUpdate() {
        if (swRegistration) {
          swRegistration.update();
        }
      }

      window.addEventListener('pageshow', function(e) {
        if (e.persisted) {
          checkForUpdate();
        }
      });

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          checkForUpdate();
        }
      });
    }
  </script>

</body>
</html>
